---

- name: Moodle- Check before if installation directory exists
  stat:
    path: "{{ moodle_src_path }}/config.php"
  register: moodle_config_source

- name: Run installer
  block:
    - name: Run installer command
      command: >
        {{ moodle_php_bin }} admin/cli/install_database.php
        --adminuser="{{ moodle_site_admin.username }}"
        --adminpass="{{ moodle_site_admin.password }}"
        --adminemail="{{ moodle_site_admin.email }}"
        --agree-license
        --fullname="{{ moodle_site_fullname }}"
        --shortname="{{ moodle_site_shortname }}"
      args:
        chdir: "{{ moodle_src_path }}"
      become: true
      become_user: "{{ moodle_webserver_user }}"
      register: installerresult
      changed_when: installerresult.rc == 0
      no_log: true
  rescue:
    - name: Show PostgreSQL service status
      command:
        argv:
          - systemctl
          - status
          - postgresql
          - --no-pager
          - --full
      register: postgres_systemctl_status
      changed_when: false
      failed_when: false
      when: dbengine == 'postgres' and (moodle_installer_debug | bool)

    - name: Show PostgreSQL recent journal
      command:
        argv:
          - journalctl
          - -u
          - postgresql
          - --no-pager
          - -n
          - "200"
      register: postgres_journal
      changed_when: false
      failed_when: false
      when: dbengine == 'postgres' and (moodle_installer_debug | bool)

    - name: Check PostgreSQL readiness
      command:
        argv:
          - pg_isready
          - -h
          - localhost
          - -p
          - "5432"
      register: postgres_isready
      changed_when: false
      failed_when: false
      when: dbengine == 'postgres' and (moodle_installer_debug | bool)

    - name: Show MySQL service status
      command:
        argv:
          - systemctl
          - status
          - mysql
          - --no-pager
          - --full
      register: mysql_systemctl_status
      changed_when: false
      failed_when: false
      when: dbengine == 'mysql' and (moodle_installer_debug | bool)

    - name: Show MariaDB service status
      command:
        argv:
          - systemctl
          - status
          - mariadb
          - --no-pager
          - --full
      register: mariadb_systemctl_status
      changed_when: false
      failed_when: false
      when: dbengine == 'mysql' and (moodle_installer_debug | bool)

    - name: Show MySQL recent journal
      command:
        argv:
          - journalctl
          - -u
          - mysql
          - --no-pager
          - -n
          - "200"
      register: mysql_journal
      changed_when: false
      failed_when: false
      when: dbengine == 'mysql' and (moodle_installer_debug | bool)

    - name: Show MariaDB recent journal
      command:
        argv:
          - journalctl
          - -u
          - mariadb
          - --no-pager
          - -n
          - "200"
      register: mariadb_journal
      changed_when: false
      failed_when: false
      when: dbengine == 'mysql' and (moodle_installer_debug | bool)

    - name: Check MySQL readiness
      command:
        argv:
          - mysqladmin
          - ping
          - -h
          - localhost
      register: mysqladmin_ping
      changed_when: false
      failed_when: false
      when: dbengine == 'mysql' and (moodle_installer_debug | bool)

    - name: Show enabled PHP modules
      command:
        argv:
          - "{{ moodle_php_bin }}"
          - -m
      register: php_modules
      changed_when: false
      failed_when: false

    - name: Fail with installer diagnostics
      fail:
        msg: |
          Moodle installer failed.
          Database diagnostics (dbengine={{ dbengine | default('unknown') }}):
          {% if not (moodle_installer_debug | bool) %}
          moodle_installer_debug=false, database service/journal diagnostics were skipped.
          {% elif dbengine == 'postgres' %}
          PostgreSQL service status:
          {{ postgres_systemctl_status.stdout | default('') }}
          {{ postgres_systemctl_status.stderr | default('') }}

          PostgreSQL journal:
          {{ postgres_journal.stdout | default('') }}
          {{ postgres_journal.stderr | default('') }}

          pg_isready:
          {{ postgres_isready.stdout | default('') }}
          {{ postgres_isready.stderr | default('') }}
          {% elif dbengine == 'mysql' %}
          MySQL service status:
          {{ mysql_systemctl_status.stdout | default('') }}
          {{ mysql_systemctl_status.stderr | default('') }}

          MariaDB service status:
          {{ mariadb_systemctl_status.stdout | default('') }}
          {{ mariadb_systemctl_status.stderr | default('') }}

          MySQL journal:
          {{ mysql_journal.stdout | default('') }}
          {{ mysql_journal.stderr | default('') }}

          MariaDB journal:
          {{ mariadb_journal.stdout | default('') }}
          {{ mariadb_journal.stderr | default('') }}

          mysqladmin ping:
          {{ mysqladmin_ping.stdout | default('') }}
          {{ mysqladmin_ping.stderr | default('') }}
          {% else %}
          No database diagnostics available for dbengine={{ dbengine | default('unknown') }}.
          {% endif %}

          PHP modules:
          {{ php_modules.stdout | default('') }}
          {{ php_modules.stderr | default('') }}
  when: moodle_config_source.stat.exists | bool
